<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeShark Ultimate Station</title>
    <style>
        :root { --primary: #1a73e8; --success: #188038; --danger: #d93025; --dark: #202124; --bg: #f1f3f4; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        
        /* SECURITY OVERLAY */
        #gatekeeper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #202124; color: white; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
        }
        .pass-input { padding: 12px; border-radius: 4px; border: none; margin-top: 10px; text-align: center; font-size: 1.2rem; }
        
        .dashboard { display: grid; grid-template-columns: 320px 1fr 320px; gap: 15px; max-width: 1400px; margin: 0 auto; display: none; } /* Hidden by default */
        
        .card { background: white; border-radius: 8px; border: 1px solid #dadce0; box-shadow: 0 1px 2px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .card-header { background: #f8f9fa; padding: 10px 15px; font-weight: bold; font-size: 0.85rem; color: #5f6368; border-bottom: 1px solid #dadce0; display: flex; justify-content: space-between; align-items: center; }
        .padding { padding: 15px; }

        /* Score Tracker */
        .score-box { display: flex; justify-content: space-around; align-items: center; text-align: center; background: #202124; color: white; padding: 15px; border-radius: 6px; }
        .score-val { font-size: 2.5rem; font-weight: bold; display: block; }
        .score-btn { background: #3c4043; border: none; color: white; padding: 5px 15px; border-radius: 4px; cursor: pointer; margin-top: 5px; }

        /* Strategy Flow */
        .flow-btn { display: block; width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #dadce0; border-radius: 6px; cursor: pointer; text-align: left; background: white; transition: 0.2s; }
        .flow-btn:hover { border-color: var(--primary); color: var(--primary); background: #f8fbff; }
        .action-box { background: #fff4e5; border-left: 4px solid #ffa117; padding: 12px; margin-bottom: 15px; font-size: 0.95rem; }

        .log-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        .log-table td { padding: 8px; border-bottom: 1px solid #eee; }
        @media (max-width: 1000px) { .dashboard { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div id="gatekeeper">
    <h2>TennisTrader Secure Access</h2>
    <input type="password" id="pass-field" class="pass-input" placeholder="Enter Password" onkeypress="checkPass(event)">
    <p style="color: #888; font-size: 0.8rem; margin-top: 20px;">Press Enter to Login</p>
</div>

<div class="dashboard" id="main-ui">
    <div class="side-col">
        <div class="card">
            <div class="card-header">SCORE TRACKER <button onclick="resetScore()" class="score-btn" style="margin:0; padding:2px 5px; font-size:10px">RESET</button></div>
            <div class="padding">
                <div class="score-box">
                    <div><span class="score-val" id="score-a">0</span><button class="score-btn" onclick="changeScore('a', 1)">+ Game</button></div>
                    <div style="font-size: 1.5rem; opacity: 0.5;">VS</div>
                    <div><span class="score-val" id="score-b">0</span><button class="score-btn" onclick="changeScore('b', 1)">+ Game</button></div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">CALCULATOR</div>
            <div class="padding">
                <input type="text" id="match-name" placeholder="Match Name">
                <input type="number" id="stake" value="10" placeholder="Stake" oninput="runCalcs()">
                <input type="number" id="odds" value="1.50" step="0.01" oninput="runCalcs()">
                <select id="trade-type" onchange="runCalcs()">
                    <option value="lay">Lay</option>
                    <option value="back">Back</option>
                </select>
                <div style="background:#f8f9fa; padding:10px; border-radius:4px; margin-bottom:10px;">
                    <div id="risk-out" style="color:var(--danger)">Liability: -$5.00</div>
                    <div id="profit-out" style="color:var(--success)">Profit: +$10.00</div>
                </div>
                <button onclick="logTrade()" style="width:100%; padding:10px; background:var(--primary); color:white; border:none; border-radius:4px; cursor:pointer;">LOG TRADE</button>
            </div>
        </div>
    </div>

    <div class="main-col">
        <div class="card" style="min-height: 500px;">
            <div class="card-header">STRATEGY FLOW</div>
            <div class="padding" id="flow-content"></div>
        </div>
    </div>

    <div class="side-col">
        <div class="card">
            <div class="card-header">HISTORY</div>
            <div class="padding">
                <table class="log-table"><tbody id="history-body"></tbody></table>
                <button onclick="clearHistory()" style="background:none; border:none; color:red; cursor:pointer; font-size:10px;">CLEAR LOGS</button>
            </div>
        </div>
    </div>
</div>

<script>
// --- SECURITY ---
const MY_PASSWORD = "sHark2354"; // CHANGE THIS TO YOUR CHOICE

function checkPass(e) {
    if (e.key === "Enter") {
        const input = document.getElementById('pass-field').value;
        if (input === MY_PASSWORD) {
            document.getElementById('gatekeeper').style.display = 'none';
            document.getElementById('main-ui').style.display = 'grid';
            renderFlow('start');
        } else {
            alert("Incorrect Password");
            document.getElementById('pass-field').value = "";
        }
    }
}

// --- LOGIC (RETAINED FROM PREVIOUS VERSION) ---
let scoreA = 0, scoreB = 0;
function changeScore(p, v) { p==='a' ? scoreA+=v : scoreB+=v; document.getElementById('score-a').innerText=scoreA; document.getElementById('score-b').innerText=scoreB; }
function resetScore() { scoreA=0; scoreB=0; changeScore('a',0); }

const flow = {
    start: { text: "Select Match Phase:", options: [{ text: "Set 1 Start", next: "s1_expect" }, { text: "Set 2 Start", next: "s2_winner" }] },
    s1_expect: { text: "Expect favorite to win easily?", options: [{ text: "Yes", next: "s1_yes" }, { text: "No", next: "s1_no" }] },
    s1_yes: { action: "Look for 20 tick rise then BACK.", options: [{ text: "Restart", next: "start" }] },
    s1_no: { action: "Look for price drop then LAY.", options: [{ text: "Restart", next: "start" }] },
    s2_winner: { text: "Who won set 1?", options: [{ text: "Fav", next: "start" }, { text: "Dog", next: "start" }] }
};

function renderFlow(id) {
    const node = flow[id];
    let html = (node.action ? `<div class="action-box">${node.action}</div>` : "") + `<div class="node-text">${node.text}</div>`;
    node.options.forEach(o => html += `<button class="flow-btn" onclick="renderFlow('${o.next}')">${o.text}</button>`);
    document.getElementById('flow-content').innerHTML = html;
}

function runCalcs() {
    const s = document.getElementById('stake').value; const o = document.getElementById('odds').value;
    const type = document.getElementById('trade-type').value;
    const liab = type === 'back' ? s : s*(o-1);
    const prof = type === 'back' ? s*(o-1) : s;
    document.getElementById('risk-out').innerText = `Liability: -$${parseFloat(liab).toFixed(2)}`;
    document.getElementById('profit-out').innerText = `Profit: +$${parseFloat(prof).toFixed(2)}`;
}

function logTrade() {
    const entry = { match: document.getElementById('match-name').value, score: `${scoreA}-${scoreB}`, details: `${document.getElementById('trade-type').value} $${document.getElementById('stake').value}` };
    let h = JSON.parse(localStorage.getItem('ts_log') || "[]"); h.unshift(entry);
    localStorage.setItem('ts_log', JSON.stringify(h)); updateUI();
}

function updateUI() {
    const h = JSON.parse(localStorage.getItem('ts_log') || "[]");
    document.getElementById('history-body').innerHTML = h.map(x => `<tr><td>${x.match} (${x.score})</td><td>${x.details}</td></tr>`).join('');
}

function clearHistory() { localStorage.removeItem('ts_log'); updateUI(); }

updateUI();
runCalcs();
</script>
</body>
</html>
