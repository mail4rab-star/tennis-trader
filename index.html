 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tennis Flow Chart App</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding: 20px; }
        #app-container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 600px; width: 100%; }
        .breadcrumb { font-size: 0.85rem; color: #666; margin-bottom: 1rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .content-area { min-height: 150px; margin-bottom: 2rem; }
        .question { font-size: 1.25rem; font-weight: 600; color: #2c3e50; margin-bottom: 1.5rem; }
        .action-box { background-color: #e8f4fd; border-left: 5px solid #3498db; padding: 1rem; margin-top: 1rem; font-style: italic; color: #2980b9; }
        .btn-group { display: flex; flex-direction: column; gap: 10px; }
        button { padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; transition: all 0.2s; }
        .btn-ans { background-color: #3498db; color: white; text-align: left; }
        .btn-ans:hover { background-color: #2980b9; }
        .nav-controls { margin-top: 2rem; border-top: 1px solid #eee; padding-top: 1rem; display: flex; gap: 10px; }
        .btn-back { background-color: #95a5a6; color: white; flex: 1; }
        .btn-restart { background-color: #e74c3c; color: white; flex: 1; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

<div id-container id="app-container">
    <div id="breadcrumb" class="breadcrumb">SELECT A STARTING POINT</div>
    <div class="content-area" id="content-area">
        </div>
    <div class="nav-controls">
        <button class="btn-back" onclick="goBack()" id="back-btn" disabled>Back</button>
        <button class="btn-restart" onclick="restart()">Restart</button>
    </div>
</div>

<script>
// Data structure derived from source 
const flowData = {
    start: {
        text: "Which set are you trading?",
        options: [
            { label: "START OF SET 1", next: "s1_q1" },
            { label: "START OF SET 2", next: "s2_q1" }
        ]
    },
    // --- SET 1 PATHWAY ---
    s1_q1: {
        breadcrumb: "Set 1 > Q1",
        text: "(Q1) Expect the favourite to win easily?",
        options: [
            { label: "YES", next: "s1_q2_yes" },
            { label: "NO", next: "s1_q2_no" }
        ]
    },
    s1_q2_yes: {
        breadcrumb: "Set 1 > Q1 > Q2",
        text: "(Q2) Chance of favourite being broken?",
        options: [
            { label: "YES", next: "s1_q3_yes_yes" },
            { label: "NO", action: "Wait for favourite’s price to rise min 20 ticks OR wait for favourite to face a break point & then back favourite", next: "s1_q3_no_back" }
        ]
    },
    s1_q3_yes_yes: {
        breadcrumb: "Set 1 > Q1 > Q2 > Q3",
        text: "(Q3) Who breaks first?",
        options: [
            { label: "Favourite", action: "Lay favourite", next: "s1_q4_lay_fav" },
            { label: "Underdog", action: "Back the favourite", next: "s1_q4_back_fav" }
        ]
    },
    s1_q4_lay_fav: {
        breadcrumb: "Set 1 > Q1 > Q2 > Q3 > Q4",
        text: "(Q4) IF favourite laid, who breaks next?",
        options: [
            { label: "Favourite", action: "Exit trade." },
            { label: "Underdog", action: "Remove liability or hedge" }
        ]
    },
    s1_q4_back_fav: {
        breadcrumb: "Set 1 > Q1 > Q2 > Q3 > Q4",
        text: "(Q4) IF favourite backed, who breaks next?",
        options: [
            { label: "No breaks", action: "Exit when score is 4-4" },
            { label: "Favourite", action: "Remove liability or hedge" },
            { label: "Underdog", action: "Exit for a loss or back favourite again (ONLY if confident favourite will recover).", next: "s1_q5_back_again" }
        ]
    },
    s1_q5_back_again: {
        breadcrumb: "Set 1 > Q1 > Q2 > Q3 > Q4 > Q5",
        text: "(Q5) IF favourite backed again, who breaks next?",
        options: [
            { label: "Favourite", action: "Remove liability" },
            { label: "Underdog", action: "Exit trade" },
            { label: "Break looks unlikely", action: "Exit trade when underdog score reaches 4" }
        ]
    },
    s1_q3_no_back: {
        breadcrumb: "Set 1 > Q1 > Q2 > Q3",
        text: "(Q3) IF favourite backed, does he/she break first in the current set?",
        options: [
            { label: "No break", action: "Exit trade at 4-4" },
            { label: "Yes", action: "Remove liability or hedge" },
            { label: "Underdog breaks", action: "Exit for a loss or back favourite again (ONLY if confident favourite will recover).", next: "s1_q4_no_back_again" }
        ]
    },
    s1_q4_no_back_again: {
        breadcrumb: "Set 1 > Q1 > Q2 > Q3 > Q4",
        text: "(Q4) IF favourite backed again, who breaks next?",
        options: [
            { label: "Favourite", action: "Remove liability" },
            { label: "Underdog", action: "Exit trade" },
            { label: "Break looks unlikely", action: "Exit trade when underdog score reaches 4" }
        ]
    },
    s1_q2_no: {
        breadcrumb: "Set 1 > Q1 > Q2",
        text: "(Q2) Is the favourite priced below 1.50?",
        options: [
            { label: "YES", action: "Wait for favourite’s price to drop 20 to 25 ticks in the early games & lay favourite", next: "s1_q3_low_price" },
            { label: "NO", action: "Wait for favourite to break serve & then lay favourite", next: "s1_q3_high_price" }
        ]
    },
    s1_q3_low_price: {
        breadcrumb: "Set 1 > Q1 > Q2 > Q3",
        text: "(Q3) IF favourite is laid, who breaks first?",
        options: [
            { label: "No pressure from underdog", action: "Exit trade" },
            { label: "Underdog", action: "Remove liability" },
            { label: "Favourite", action: "Either exit trade OR lay favourite again (ONLY if confident underdog will be competitive)", next: "s1_q4_low_lay_again" }
        ]
    },
    s1_q4_low_lay_again: {
        breadcrumb: "Set 1 > Q1 > Q2 > Q3 > Q4",
        text: "(Q4) IF favourite laid again, who breaks next?",
        options: [
            { label: "Favourite", action: "Exit for loss" },
            { label: "Underdog", action: "Remove liability" },
            { label: "Break from underdog looks unlikely", action: "Exit for small loss" }
        ]
    },
    s1_q3_high_price: {
        breadcrumb: "Set 1 > Q1 > Q2 > Q3",
        text: "(Q3) IF favourite laid, who breaks next?",
        options: [
            { label: "Underdog", action: "Remove liability or hedge for profit" },
            { label: "Favourite", action: "Either exit the trade or lay the favourite again (ONLY if confident the underdog will fight back)", next: "s1_q4_high_lay_again" },
            { label: "No more breaks", action: "Exit for a small loss, keep the original lay or lay again", next: "s1_q4_no_more_breaks" }
        ]
    },
    s1_q4_high_lay_again: {
        breadcrumb: "Set 1 > Q1 > Q2 > Q3 > Q4",
        text: "(Q4) IF favourite laid again, who breaks next?",
        options: [
            { label: "Favourite", action: "Exit for loss" },
            { label: "Underdog", action: "Remove liability or hedge" },
            { label: "Break from underdog looks unlikely", action: "Exit for small loss" }
        ]
    },
    s1_q4_no_more_breaks: {
        breadcrumb: "Set 1 > Q1 > Q2 > Q3 > Q4",
        text: "(Q4) IF kept original lay or laid again, who breaks next?",
        options: [
            { label: "Underdog", action: "Remove liability" },
            { label: "Favourite", action: "Exit for loss" }
        ]
    },

    // --- SET 2 PATHWAY ---
    s2_q1: {
        breadcrumb: "Set 2 > Q1",
        text: "(Q1) Who won Set 1?",
        options: [
            { label: "Underdog", next: "s2_q2_ud" },
            { label: "Favourite", next: "s2_q2_fav" }
        ]
    },
    s2_q2_ud: {
        breadcrumb: "Set 2 > Q1 > Q2",
        text: "(Q2) Was the favourite competitive in Set 1?",
        options: [
            { label: "NO", action: "If the favourite has not created break chances or maybe look injured or sick, safer to leave the set alone" },
            { label: "YES", action: "Favourite will usually have had chances in Set 1 & favoured by market in Set 2. Lay the underdog", next: "s2_q3_lay_ud" }
        ]
    },
    s2_q3_lay_ud: {
        breadcrumb: "Set 2 > Q1 > Q2 > Q3",
        text: "(Q3) IF underdog is laid, is underdog broken before score is 4-4?",
        options: [
            { label: "YES", action: "Remove liability to leave a free bet or hedge evenly" },
            { label: "NO", action: "Remove liability or hedge evenly" },
            { label: "Underdog broke favourite", action: "Exit for a loss OR lay the underdog again", next: "s2_q4_ud_lay_again" }
        ]
    },
    s2_q4_ud_lay_again: {
        breadcrumb: "Set 2 > Q1 > Q2 > Q3 > Q4",
        text: "(Q4) IF underdog was laid again, who breaks next?",
        options: [
            { label: "Favourite", action: "Remove all liability" },
            { label: "Underdog", action: "Exit for a loss" }
        ]
    },
    s2_q2_fav: {
        breadcrumb: "Set 2 > Q1 > Q2",
        text: "(Q2) How many times was the favourite broken?",
        options: [
            { label: "Zero", action: "Leave set alone OR wait for favourite’s price to drop 10 to 15 ticks, & lay favourite IF underdog has had break chances in Set 1", next: "s2_q3_fav_0" },
            { label: "Once", action: "Wait for favourite’s price to drop by 10 to 15 ticks before laying favourite", next: "s2_q3_fav_1" },
            { label: "Two or more times", action: "Lay favourite with part stake", next: "s2_q3_fav_2" }
        ]
    },
    s2_q3_fav_0: {
        breadcrumb: "Set 2 > Q1 > Q2 > Q3",
        text: "(Q3) IF favourite is laid, is favourite broken before score is 4-4?",
        options: [
            { label: "NO", action: "Exit at 4-4" },
            { label: "YES", action: "Remove liability or hedge evenly" },
            { label: "Favourite broke underdog", action: "Exit OR lay favourite again (ONLY if confident underdog will recover at least 1 break)" }
        ]
    },
    s2_q3_fav_1: {
        breadcrumb: "Set 2 > Q1 > Q2 > Q3",
        text: "(Q3) IF favourite is laid, is favourite broken before score is 4-4?",
        options: [
            { label: "NO", action: "Exit at 4-4" },
            { label: "YES", action: "Remove liability or hedge evenly" },
            { label: "Favourite broke underdog", action: "Exit OR lay favourite (ONLY if confident underdog will recover at least 1 break)" }
        ]
    },
    s2_q3_fav_2: {
        breadcrumb: "Set 2 > Q1 > Q2 > Q3",
        text: "(3) IF favourite laid (with part stakes), is favourite broken before score is 4-4?",
        options: [
            { label: "NO", action: "Exit at 4-4" },
            { label: "YES", action: "Remove liability or hedge evenly" },
            { label: "Favourite broke underdog", action: "Exit OR lay favourite again (ONLY if confident the underdog will recover at least 1 break)" }
        ]
    }
};

let historyStack = ['start'];

function render() {
    const currentStateKey = historyStack[historyStack.length - 1];
    const state = flowData[currentStateKey];
    const contentArea = document.getElementById('content-area');
    const breadcrumbArea = document.getElementById('breadcrumb');
    const backBtn = document.getElementById('back-btn');

    // Update Breadcrumb
    breadcrumbArea.innerText = state.breadcrumb || "SELECT A STARTING POINT";
    
    // Clear Area
    contentArea.innerHTML = '';

    // Render Question
    const qDiv = document.createElement('div');
    qDiv.className = 'question';
    qDiv.innerText = state.text;
    contentArea.appendChild(qDiv);

    // Render Action if present
    if (state.action) {
        const aDiv = document.createElement('div');
        aDiv.className = 'action-box';
        aDiv.innerHTML = `<strong>Act:</strong> ${state.action}`;
        contentArea.appendChild(aDiv);
    }

    // Render Buttons
    const btnGroup = document.createElement('div');
    btnGroup.className = 'btn-group';
    state.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'btn-ans';
        btn.innerText = opt.label;
        btn.onclick = () => {
            // Logic: if option has an action, we update current state or move to next
            if (opt.action) {
                // If it's a final action with no 'next', we just display it
                // To support 'back' logic, we create a virtual state for the action
                const virtualKey = 'action_' + Math.random().toString(36).substr(2, 9);
                flowData[virtualKey] = {
                    breadcrumb: state.breadcrumb,
                    text: state.text,
                    action: opt.action,
                    options: opt.next ? flowData[opt.next].options : []
                };
                if (opt.next) {
                    historyStack.push(opt.next);
                    // We need to inject the action into the next state for display
                    flowData[opt.next].action = opt.action;
                } else {
                    // terminal state
                    historyStack.push(virtualKey);
                }
            } else if (opt.next) {
                historyStack.push(opt.next);
            }
            render();
        };
        btnGroup.appendChild(btn);
    });
    contentArea.appendChild(btnGroup);

    // Update Back button state
    backBtn.disabled = historyStack.length <= 1;
}

function goBack() {
    if (historyStack.length > 1) {
        historyStack.pop();
        render();
    }
}

function restart() {
    historyStack = ['start'];
    render();
}

// Initial render
render();
</script>

</body>
</html>
